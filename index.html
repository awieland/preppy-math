<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Math Facts Practice</title>
  <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      font-family: 'Indie Flower', cursive;
      background-color: #cce6ff;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 1.2rem;
      text-align: center;
    }
    h1 {
      font-size: 2.64rem;
      margin: 0.6rem 0;
    }
    #setup {
      margin: 0.6rem;
      font-size: 1.2rem;
    }
    #game-container {
      margin-top: 1.2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #timer {
      font-size: 1.44rem;
      margin-bottom: 0.6rem;
    }
    #problem {
      font-size: 3rem;
      margin: 1.2rem 0;
      min-height: 3.5rem;
    }
    #feedback {
      height: 1.8rem;
      margin-bottom: 0.6rem;
      font-size: 1.5rem;
    }
    #summary {
      font-size: 1.56rem;
      font-weight: bold;
      margin-bottom: 1rem;
      min-height: 2rem;
    }
    #keypad {
      display: grid;
      grid-template-columns: repeat(3, 96px);
      gap: 0.6rem;
      justify-content: center;
      margin-top: 0.8rem;
    }
    .key {
      background-color: #ffb6c1;
      border: none;
      border-radius: 14px;
      font-family: 'Indie Flower', cursive;
      font-size: 1.8rem;
      padding: 0.6rem;
      cursor: pointer;
      user-select: none;
    }
    .key:active {
      transform: scale(0.97);
    }
    #key-0 {
      grid-column: span 2;
    }
    #backspace {
      background-color: #ffb6c1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #reset {
      margin-top: 1.2rem;
      background-color: #ffb6c1;
      border: none;
      border-radius: 14px;
      font-family: 'Indie Flower', cursive;
      font-size: 1.44rem;
      padding: 0.6rem 1.2rem;
      cursor: pointer;
    }
    select {
      font-size: 1.2rem;
      padding: 0.3rem;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>Math Facts Practice</h1>
  <div id="setup">
    <label for="fixedAddend">Fix second addend:</label>
    <select id="fixedAddend">
      <option value="">Random</option>
      <option value="0">+0</option>
      <option value="1">+1</option>
      <option value="2">+2</option>
      <option value="3">+3</option>
      <option value="4">+4</option>
      <option value="5">+5</option>
      <option value="6">+6</option>
      <option value="7">+7</option>
      <option value="8">+8</option>
      <option value="9">+9</option>
    </select>
  </div>
  <div id="game-container">
    <div id="timer">Time: 60</div>
    <div id="problem">Press start</div>
    <div id="feedback"></div>
    <div id="summary"></div> <!-- moved above keypad -->
    <div id="keypad"></div>
    <button id="reset">Start / Reset</button>
  </div>

  <script>
    const problemEl = document.getElementById('problem');
    const feedbackEl = document.getElementById('feedback');
    const timerEl = document.getElementById('timer');
    const keypadEl = document.getElementById('keypad');
    const summaryEl = document.getElementById('summary');
    const resetBtn = document.getElementById('reset');
    const fixedAddendEl = document.getElementById('fixedAddend');

    let num1, num2, answer;
    let input = '';
    let correct = 0;
    let total = 0;
    let timeLeft = 60;
    let timer;
    let lastProblem = '';
    let roundActive = false;

    function newProblem() {
      if (!roundActive) return;
      do {
        num1 = Math.floor(Math.random() * 10);
        const fixed = fixedAddendEl.value;
        num2 = fixed === '' ? Math.floor(Math.random() * 10) : parseInt(fixed);
        answer = num1 + num2;
      } while (`${num1}+${num2}` === lastProblem);
      lastProblem = `${num1}+${num2}`;
      input = '';
      problemEl.textContent = `${num1} + ${num2} = ?`;
      feedbackEl.textContent = '';
      summaryEl.textContent = '';
    }

    function updateTimer() {
      if (timeLeft > 0) {
        timeLeft--;
        timerEl.textContent = `Time: ${timeLeft}`;
      } else {
        clearInterval(timer);
        roundActive = false;
        showSummary();
      }
    }

    function showSummary() {
      const accuracy = total ? Math.round((correct / total) * 100) : 0;
      problemEl.textContent = `You got ${correct}/${total} correct (${accuracy}%).`; // replaces problem
      feedbackEl.textContent = '';
      summaryEl.textContent = ''; // optional: clear the old summary text
    }

    function handleInput(value) {
      if (!roundActive) return;
      if (value === 'backspace') {
        input = input.slice(0, -1);
        problemEl.textContent = `${num1} + ${num2} = ${input || '?'}`;
        return;
      }
      input += value;
      problemEl.textContent = `${num1} + ${num2} = ${input}`;
      if (parseInt(input) === answer) {
        feedbackEl.textContent = '✅';
        correct++;
        total++;
        setTimeout(newProblem, 300);
      } else if (input.length >= answer.toString().length) {
        feedbackEl.textContent = '❌';
        total++;
        setTimeout(newProblem, 500);
      }
    }

    function buildKeypad() {
      keypadEl.innerHTML = '';
      const layout = ['7','8','9','4','5','6','1','2','3','0','backspace'];
      layout.forEach(key => {
        const btn = document.createElement('button');
        btn.classList.add('key');
        if (key === 'backspace') {
          btn.id = 'backspace';
          btn.innerHTML = '&#9003;';
        } else {
          btn.textContent = key;
          if (key === '0') btn.id = 'key-0';
        }
        btn.addEventListener('click', () => handleInput(key));
        keypadEl.appendChild(btn);
      });
    }

    document.addEventListener('keydown', e => {
      if (!roundActive) return;
      if (e.key >= '0' && e.key <= '9') handleInput(e.key);
      if (e.key === 'Backspace') handleInput('backspace');
    });

    resetBtn.addEventListener('click', () => {
      clearInterval(timer);
      timeLeft = 60;
      correct = 0;
      total = 0;
      timerEl.textContent = `Time: ${timeLeft}`;
      roundActive = true;
      newProblem();
      timer = setInterval(updateTimer, 1000);
    });

    buildKeypad();

    // --- PWA Service Worker Registration ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js')
          .then(reg => console.log('Service worker registered:', reg.scope))
          .catch(err => console.error('Service worker registration failed:', err));
      });
    }
  </script>
</body>
</html>
