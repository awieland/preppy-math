<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Addition Practice — Fixed Addend — 60s</title>
  <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap" rel="stylesheet">
  <style>
    :root{font-family:'Indie Flower', cursive; color:#333;}
    body{max-width:700px;margin:32px auto;padding:20px;background:#d7ecff;color:#333}
    h1{font-size:1.4rem;margin:0 0 8px}
    p{margin:8px 0}
    .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
    select, button{font-family:'Indie Flower', cursive;}
    select{font-size:1rem;padding:6px}
    button{padding:8px 10px;font-size:1rem;background:#ffd6e8;border:1px solid #ddd;border-radius:6px;cursor:pointer}
    button:disabled{opacity:0.6;cursor:not-allowed}
    .card{border:1px solid #ddd;padding:18px;border-radius:8px;background:#fafafa}
    .problem{font-size:2rem;margin:10px 0}
    .feedback{min-height:1.5rem;font-weight:600}
    .summary{margin-top:14px}
    .small{font-size:0.9rem;color:#555}
    .hidden{display:none}
    #history{margin-top:10px;font-family:'Indie Flower', cursive;font-size:0.95rem; max-height:150px; overflow-y:auto; border-top:1px solid #ddd; padding-top:6px; white-space:pre;}
    .correct{color:green}
    .wrong{color:#c0392b}
    #timer{font-weight:700}
    .keypad{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
    .keypad button{flex:1 0 30%; font-size:1.5rem; padding:12px; background:#ffd6e8; border:1px solid #ddd; border-radius:6px; cursor:pointer}
  </style>
</head>
<body>
  <h1>Addition practice (0–9 + fixed addend)</h1>
  <p class="small">Mobile-friendly version. Choose an addend (0–9), press <kbd>Start</kbd>, tap numbers or use keyboard. One-minute round.</p>

  <div class="controls">
    <label for="addend">Fix addend:</label>
    <select id="addend">
      <option value="0">+0</option>
      <option value="1">+1</option>
      <option value="2">+2</option>
      <option value="3">+3</option>
      <option value="4">+4</option>
      <option value="5">+5</option>
      <option value="6">+6</option>
      <option value="7">+7</option>
      <option value="8">+8</option>
      <option value="9">+9</option>
    </select>

    <button id="startBtn">Start</button>
    <button id="resetBtn">Reset</button>
  </div>

  <div class="card">
    <div><span>Time left: </span><span id="timer">60</span>s</div>

    <div class="problem" id="problem">—</div>

    <div>
      <label for="answer">Your answer:</label>
      <input id="answer" inputmode="numeric" autocomplete="off" style="font-size:1.2rem;padding:6px;width:120px; font-family:'Indie Flower', cursive;">
    </div>

    <div class="keypad">
      <button data-num="1">1</button>
      <button data-num="2">2</button>
      <button data-num="3">3</button>
      <button data-num="4">4</button>
      <button data-num="5">5</button>
      <button data-num="6">6</button>
      <button data-num="7">7</button>
      <button data-num="8">8</button>
      <button data-num="9">9</button>
      <button data-num="0">0</button>
      <button data-num="clear">C</button>
    </div>

    <div class="feedback" id="feedback"></div>
    <div id="history" aria-live="polite"></div>

    <div class="summary hidden" id="summary">
      <h2>Round summary</h2>
      <p id="summaryText"></p>
      <p class="small">Change the addend and press <strong>Start</strong> for another round.</p>
    </div>
  </div>

  <script>
    (function(){
      const addendSelect = document.getElementById('addend');
      const startBtn = document.getElementById('startBtn');
      const resetBtn = document.getElementById('resetBtn');
      const problemEl = document.getElementById('problem');
      const answerInput = document.getElementById('answer');
      const feedbackEl = document.getElementById('feedback');
      const timerEl = document.getElementById('timer');
      const summaryEl = document.getElementById('summary');
      const summaryText = document.getElementById('summaryText');
      const historyEl = document.getElementById('history');
      const keypadButtons = document.querySelectorAll('.keypad button');

      let addend = Number(addendSelect.value);
      let timer = 60;
      let interval = null;
      let running = false;
      let problemsAsked = 0;
      let correct = 0;
      let incorrect = 0;
      let lastLeft = null;

      function rand0to9(){
        let n;
        do { n = Math.floor(Math.random()*10); } while(n === lastLeft);
        lastLeft = n;
        return n;
      }

      function newProblem(){
        const left = rand0to9();
        problemEl.textContent = `${left} + ${addend} =`;
        problemEl.dataset.left = left;
        answerInput.value = '';
        feedbackEl.textContent = '';
      }

      function startRound(){
        if(running) return;
        addend = Number(addendSelect.value);
        problemsAsked = 0; correct = 0; incorrect = 0;
        historyEl.textContent = '';
        summaryEl.classList.add('hidden');
        timer = 60; timerEl.textContent = timer;
        running = true;
        startBtn.disabled = true;
        addendSelect.disabled = true;
        newProblem();
        interval = setInterval(()=>{
          timer -= 1;
          timerEl.textContent = timer;
          if(timer <= 0){ endRound(); }
        },1000);
      }

      function endRound(){
        running = false;
        clearInterval(interval);
        startBtn.disabled = false;
        addendSelect.disabled = false;
        problemEl.textContent = '—';
        feedbackEl.textContent = '';
        summaryEl.classList.remove('hidden');
        const total = correct + incorrect;
        summaryText.innerHTML = `Correct: <strong>${correct}</strong><br>Incorrect: <strong>${incorrect}</strong><br>Total attempted: <strong>${total}</strong><br>Facts per minute (correct): <strong>${correct}</strong>`;
      }

      function resetAll(){
        clearInterval(interval);
        running = false;
        timer = 60; timerEl.textContent = timer;
        problemsAsked = 0; correct = 0; incorrect = 0;
        startBtn.disabled = false;
        addendSelect.disabled = false;
        problemEl.textContent = '—';
        feedbackEl.textContent = '';
        historyEl.textContent = '';
        summaryEl.classList.add('hidden');
      }

      function submitAnswer(userVal){
        if(!running) return;
        const left = Number(problemEl.dataset.left);
        if(Number.isNaN(left)) return;
        const correctVal = left + addend;
        if(userVal === null || userVal === undefined) return;

        problemsAsked += 1;
        if(userVal === correctVal){
          correct += 1;
          feedbackEl.textContent = '✓';
          feedbackEl.className = 'feedback correct';
          historyEl.textContent += `${left} + ${addend} = ${userVal} ✓\n`;
        } else {
          incorrect += 1;
          feedbackEl.textContent = `✗ (answer: ${correctVal})`;
          feedbackEl.className = 'feedback wrong';
          historyEl.textContent += `${left} + ${addend} = ${userVal} ✗ → ${correctVal}\n`;
        }
        historyEl.scrollTop = historyEl.scrollHeight;
        newProblem();
      }

      function handleInputDigit(digit){
        answerInput.value += digit;
        const left = Number(problemEl.dataset.left);
        const correctVal = left + addend;
        if(answerInput.value.length >= String(correctVal).length){
          submitAnswer(Number(answerInput.value));
        }
      }

      startBtn.addEventListener('click', startRound);
      resetBtn.addEventListener('click', resetAll);

      keypadButtons.forEach(btn => {
        btn.addEventListener('click', ()=>{
          const val = btn.dataset.num;
          if(val === 'clear'){
            answerInput.value = '';
          } else {
            handleInputDigit(val);
          }
        });
      });

      answerInput.addEventListener('keydown', (e)=>{
        if(e.key >= '0' && e.key <= '9'){
          e.preventDefault();
          handleInputDigit(e.key);
        } else if(e.key === 'Backspace'){
          e.preventDefault();
          answerInput.value = '';
        }
      });

      resetAll();
    })();
  </script>
</body>
</html>
